---
layout: null
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="About {{ site.data.profile.primary_name }} — AI researcher.">
  <title>About — {{ site.data.profile.primary_name }}</title>
  <link rel="stylesheet" href="{{ 'assets/css/about.css' | relative_url }}?v=4">
  <script src="{{ 'assets/js/about.js' | relative_url }}?v=1" defer></script>
</head>
<body>
  <a class="back-link" href="{{ '/' | relative_url }}"><span aria-hidden="true">←</span> Home</a>
  <main class="about-page">
    <div class="portrait-wrap">
      <img class="portrait" src="{{ site.data.profile.portrait_url | relative_url }}" alt="{{ site.data.profile.primary_name }}" width="300" height="300" fetchpriority="high">
    </div>
    <section class="introduction" aria-label="About me">
      <div class="biography">{% include about_bio.html %}</div>
      <button class="show-all" type="button" hidden>Show full introduction <span aria-hidden="true">↗</span></button>
    </section>
  </main>
</body>
</html>
